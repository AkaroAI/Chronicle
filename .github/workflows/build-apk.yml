name: Build Chronicle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Chronicle debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chronicle-debug-signing-key-v2

      - name: Create signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Chronicle APK
        run: gradle assembleDebug --stacktrace

      - name: Confirm APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chronicle-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
